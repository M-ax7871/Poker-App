[tool.poetry]
name = "poker-backend"
version = "0.1.0"
description = "FastAPI Backend for Poker Exercise"
authors = ["Maxwell Ogeto ogetomaxwell2018@gmail.com"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
psycopg2-binary = "^2.9.9"
pokerkit = "^0.4.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.26.0"
pyyaml = "^6.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"